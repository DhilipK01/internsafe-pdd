name: "🌐 Selenium E2E Tests (300+ Cases)"

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  selenium-e2e:
    name: "Selenium E2E Test Suite"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: "📥 Checkout Repository"
        uses: actions/checkout@v4

      - name: "🐍 Set Up Python 3.11"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: "📦 Install Python Dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl pytest

      - name: "🧪 Run Selenium E2E Test Suite (300+ Cases)"
        run: |
          python "app testing/selenium_ci_runner.py" --output selenium_results.xlsx
        env:
          PYTHONUNBUFFERED: "1"

      - name: "📊 Upload Selenium Test Results"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selenium-test-results
          path: |
            selenium_results.xlsx
            selenium_report.txt
          retention-days: 30

      - name: "✅ Verify 300+ Tests Passed"
        run: |
          python -c "
          import json, sys
          with open('selenium_summary.json') as f:
              s = json.load(f)
          print(f'Total: {s[\"total\"]} | Passed: {s[\"passed\"]} | Rate: {s[\"pass_rate\"]}%')
          assert s['passed'] >= 300, f'Expected >= 300 passed, got {s[\"passed\"]}'
          assert s['pass_rate'] == 100.0, f'Expected 100% pass rate, got {s[\"pass_rate\"]}%'
          print('SUCCESS: 300+ Selenium tests passed at 100% rate!')
          "
