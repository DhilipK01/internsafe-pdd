name: "⚙️ Backend & Frontend Tests (300+ Cases Each)"

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend-tests:
    name: "Backend API Test Suite (300+ Cases)"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: "📥 Checkout Repository"
        uses: actions/checkout@v4

      - name: "🐍 Set Up Python 3.11"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: "📦 Install Dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl pytest

      - name: "⚙️ Run Backend API Test Suite (300+ Cases)"
        run: |
          python "backend test/backend_test.py" --output backend_results.xlsx
        env:
          PYTHONUNBUFFERED: "1"

      - name: "📊 Upload Backend Test Results"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: |
            backend test/backend_test_results.xlsx
            backend test/input_results.xlsx
          retention-days: 30

      - name: "✅ Verify 300+ Backend Tests Passed"
        run: |
          python "backend test/backend_ci_verify.py"

  frontend-tests:
    name: "Frontend UI Test Suite (300+ Cases)"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: "📥 Checkout Repository"
        uses: actions/checkout@v4

      - name: "🐍 Set Up Python 3.11"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: "📦 Install Dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl pytest

      - name: "🌐 Run Frontend UI Test Suite (300+ Cases)"
        run: |
          python "frontend test/frontend_test.py" --output frontend_results.xlsx
        env:
          PYTHONUNBUFFERED: "1"

      - name: "📊 Upload Frontend Test Results"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-test-results
          path: |
            frontend test/frontend_test_results.xlsx
            frontend test/input_results.xlsx
          retention-days: 30

      - name: "✅ Verify 300+ Frontend Tests Passed"
        run: |
          python "frontend test/frontend_ci_verify.py"
