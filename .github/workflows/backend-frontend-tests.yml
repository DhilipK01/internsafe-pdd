name: "⚙️ Backend & Frontend Tests (300+ Cases Each)"

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend-tests:
    name: "Backend API — 300+ Cases"
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: "📥 Checkout Repository"
        uses: actions/checkout@v4

      - name: "🐍 Set Up Python 3.11"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: "📦 Install Dependencies"
        run: pip install openpyxl

      - name: "⚙️ Run Backend Suite Only"
        run: python run_all_tests.py --suite backend

      - name: "📊 Upload Backend Report"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-results
          path: |
            backend test/backend_test_results.xlsx
            backend test/input_results.xlsx
          retention-days: 30

  frontend-tests:
    name: "Frontend UI — 300+ Cases"
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: "📥 Checkout Repository"
        uses: actions/checkout@v4

      - name: "🐍 Set Up Python 3.11"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: "📦 Install Dependencies"
        run: pip install openpyxl

      - name: "🖥️ Run Frontend Suite Only"
        run: python run_all_tests.py --suite frontend

      - name: "📊 Upload Frontend Report"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-results
          path: |
            frontend test/frontend_test_results.xlsx
            frontend test/input_results.xlsx
          retention-days: 30
