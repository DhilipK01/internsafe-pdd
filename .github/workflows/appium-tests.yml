name: "📱 Appium Mobile Tests (300+ Cases)"

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  appium-mobile:
    name: "Appium Mobile E2E — 300+ Cases"
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: "📥 Checkout Repository"
        uses: actions/checkout@v4

      - name: "🐍 Set Up Python 3.11"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: "📦 Install Dependencies"
        run: pip install openpyxl

      - name: "📱 Run Appium Mobile Suite Only"
        run: python run_all_tests.py --suite appium

      - name: "📊 Upload Appium Report"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: appium-results
          path: |
            app testing/appium_test_results.xlsx
            app testing/appium_E2E_results.xlsx
          retention-days: 30
