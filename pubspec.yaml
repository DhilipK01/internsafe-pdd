name: internsfe
description: Internsafe - AI-powered student internship protection.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.4
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  fl_chart: ^0.69.2
  lucide_icons: ^0.257.0
  intl: ^0.19.0
  equatable: ^2.0.7
  uuid: ^4.5.1
  flutter_dotenv: ^5.2.1
  dio: ^5.7.0
  file_picker: ^8.1.7
  image_picker: ^1.1.2
  google_sign_in: ^6.2.2
  sign_in_button: ^3.2.0
  mime: ^2.0.0
  http_parser: ^4.1.0
  app_links: ^6.3.3
  share_plus: ^10.1.4
  pdfx: ^2.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/internsafe_ai_logo.png
  adaptive_icon_background: "#060B14"
  adaptive_icon_foreground: assets/branding/internsafe_ai_logo.png

flutter:
  uses-material-design: true
  fonts:
    - family: GrandHotel
      fonts:
        - asset: assets/fonts/GrandHotel-Regular.ttf
  assets:
    - assets/branding/internsafe_ai_logo.png
    - assets/fonts/
    - assets/images/
    - .env
